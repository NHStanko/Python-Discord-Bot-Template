name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Serialize main publication; PR refs use independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ghcr.io/nhstanko/discord-bot:latest
      - name: Check whether this commit is still main
        id: publication
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          main_sha=${main_ref%%[[:space:]]*}
          if [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: this commit is no longer main."
          fi
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publication.outputs.current == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the Docker image to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publication.outputs.current == 'true' }}
        run: docker push ghcr.io/nhstanko/discord-bot:latest
